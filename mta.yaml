_schema-version: "3.1"
ID: scrum-5-mapping-table
version: 1.1.0
description: "SCRUM-5 CAP mapping_table with Fiori Elements UI on HANA Cloud"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - cds build --production
modules:
  # CAP service + Fiori UI (served statically from /app)
  - name: scrum-5-mapping-table
    type: nodejs
    path: .
    parameters:
      memory: 256M
      disk-quota: 1024M
      routes:
        - route: scrum-5-mapping-table-b551a6dctrial.cfapps.us10-001.hana.ondemand.com
    build-parameters:
      builder: npm
      ignore: ["node_modules/", "mta_archives/", ".github/", "*.mtar", "gen/", "default-env.json"]
    requires:
      - name: scrum-5-mapping-table-db

  # Deploys tables + CSV data into the HDI container
  - name: scrum-5-mapping-table-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
    requires:
      - name: scrum-5-mapping-table-db

resources:
  - name: scrum-5-mapping-table-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
